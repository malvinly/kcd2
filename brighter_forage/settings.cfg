-- Brighter Forage settings
--
-- Press the pulse key in game (F5 to start with) and everything this mod covers
-- lights up for a while (30 seconds to start with). This file sets that key,
-- how long the light lasts, and the colour each thing lights up in.
--
-- Changes apply the next time you start the game.
-- To apply them now: open the console with ~, type
--   exec mods/brighter_forage/settings.cfg
-- and press Enter. A new key works straight away, but the old one also keeps
-- working until you restart.
--
-- Lines starting with -- are notes; the game skips them.

-- Pulse key
-- Change f5 to another key, such as f6, g, np_1 (number pad) or mouse4.
-- Pick a key the game doesn't use, or pressing it does both things.
-- If this line is missing, no key pulses.
bind f5 brighter_forage_pulse

-- Pulse length
-- How many seconds things stay lit after you press the key. Any number above 0.
-- Pressing the key again while they're lit starts the count again.
-- Pulses significantly longer than 30 seconds haven't been tested in game yet.
-- If this line is missing, the pulse lasts 30 seconds.
brighter_forage_seconds 30

-- Colours
-- To change a colour, change the last word on its line to one of these:
--   magenta   bright pink-purple
--   gold      bright yellow
--   off       don't light this one up
--   r,g,b     your own colour: three numbers, commas, no spaces
--             (magenta is 20,0,20 and gold is 20,14,0)
-- Anything not listed here lights up magenta.

-- Herbs: two groups, each lights up in one colour
-- herbs_gold is belladonna and Herb Paris; herbs is every other herb.
brighter_forage_color herbs magenta
brighter_forage_color herbs_gold gold

-- Mushrooms
brighter_forage_color fly_agaric gold
brighter_forage_color parasol magenta
brighter_forage_color penny_bun magenta

-- Bird's nests
brighter_forage_color nests magenta

-- Beehives: each name is one hive material (beehive_ab covers hives a and b)
brighter_forage_color beehive_ab magenta
brighter_forage_color beehive_c magenta
brighter_forage_color beehive_g magenta
brighter_forage_color honeycomb magenta

-- Fish traps
brighter_forage_color fish_trap_a magenta
brighter_forage_color fish_trap_b magenta
brighter_forage_color fish_trap_c magenta

-- Buried treasure: the plain sack and its forest, grassy and wet ground variants
brighter_forage_color buried_sack magenta
brighter_forage_color buried_sack_forest magenta
brighter_forage_color buried_sack_grassy magenta
brighter_forage_color buried_sack_wet magenta

-- Graves: the plain grave and its dirt, forest and old variants
brighter_forage_color grave_pit magenta
brighter_forage_color grave_pit_dirt magenta
brighter_forage_color grave_pit_forest magenta
brighter_forage_color grave_pit_old magenta
